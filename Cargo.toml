[package]
name = "singularity"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["ui", "system_clipboard"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 0
